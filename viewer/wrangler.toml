name = "anndata-browser"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# The built viewer. Static-asset requests are served from Cloudflare's edge and do not count
# against the Workers request limit.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, "single-page-application" would answer /data/* with index.html instead of
# letting the Worker reach R2. Needs wrangler >= 4.20.0.
run_worker_first = ["/data/*"]

# Optional: serve packed .scb datasets from R2 at /data/<key>, so the viewer can open them with
# ?data=/data/<key>. Uncomment and set your own bucket name, then create it once with:
#     npx wrangler r2 bucket create <your-bucket>
# Without this binding the Worker simply 404s /data/* and the site behaves as a static deploy.
# [[r2_buckets]]
# binding = "DATA"
# bucket_name = "your-bucket-name"
